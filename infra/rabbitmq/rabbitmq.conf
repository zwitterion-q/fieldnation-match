# Topology is declared in definitions.json, not in application bootstrap, so the
# broker is reproducible and reviewable independently of any service.
load_definitions = /etc/rabbitmq/definitions.json

# How long an unacked message may be held before the broker assumes the consumer
# has stalled and requeues it. Must exceed the slowest legitimate handler.
consumer_timeout = 300000

# Prefetch is deliberately NOT set globally -- it belongs on the consumer channel,
# where each service can tune it to its own workload.
