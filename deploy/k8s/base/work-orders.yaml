# The lifecycle core: dispatch, accept/reject, submit, approve.
# Three replicas is not padding -- it is the competing-consumers proof. All
# three bind the same queues, RabbitMQ round-robins deliveries between them,
# and the handlers stay correct because they are idempotent
# (services/work-orders/src/outbox/outbox.relay.ts drain(), and the unique
# constraint on assignment_id that makes the escrow handler commute).
#
# STRANGLER_MODE runs at canary here: 10% of resolve traffic goes to the new
# path, the rest to the legacy api service, and divergence is measured on
# every request. services/work-orders/src/strangler/strangler.service.ts
apiVersion: v1
kind: Service
metadata:
  name: work-orders
  namespace: fieldnation
spec:
  selector:
    app: work-orders
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: work-orders
  namespace: fieldnation
  labels:
    app: work-orders
spec:
  replicas: 3
  selector:
    matchLabels:
      app: work-orders
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # never drop below the declared replica count
      maxSurge: 1            # during a deploy; consumers keep draining
  template:
    metadata:
      labels:
        app: work-orders
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across availability zones. Without this the scheduler
      # is free to put all three work-orders pods on one node, and a single
      # SPOT reclamation takes the whole consumer group with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: work-orders
      containers:
        - name: work-orders
          image: IMAGE_PLACEHOLDER/work-orders:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: WO_DSN
              valueFrom:
                secretKeyRef:
                  name: fieldnation-runtime
                  key: WO_DSN
            - name: RABBIT_URL
              valueFrom:
                secretKeyRef:
                  name: fieldnation-runtime
                  key: RABBIT_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fieldnation-runtime
                  key: JWT_SECRET
            - name: SERVICE_NAME
              value: "work-orders"
            - name: PORT
              value: "8000"
            - name: LEGACY_API_URL
              value: "http://api:8000"
            - name: STRANGLER_MODE
              value: "canary"
            - name: STRANGLER_CANARY_PCT
              value: "10"
          # Readiness gates traffic; liveness restarts a wedged process. They
          # are separate probes on purpose: a pod that has lost its broker
          # connection should stop receiving HTTP (not ready) without being
          # killed and losing its in-flight work (still alive).
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
              # No CPU limit. A CPU limit throttles via CFS quota, which shows
              # up as latency spikes that look like application bugs. Requests
              # give the scheduler what it needs; the limit only hurts.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# A PodDisruptionBudget is what stops a node drain -- a SPOT reclamation, a
# cluster upgrade -- from evicting every replica at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: work-orders
  namespace: fieldnation
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: work-orders
