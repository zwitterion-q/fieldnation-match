apiVersion: v1
kind: Namespace
metadata:
  name: fieldnation
  labels:
    app.kubernetes.io/part-of: fieldnation-match
    # Pod Security Admission. `restricted` is the strictest profile and every
    # workload here complies: no root, no privilege escalation, seccomp on.
    # Setting it at the namespace means a future manifest that violates it is
    # rejected at admission rather than discovered later.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
