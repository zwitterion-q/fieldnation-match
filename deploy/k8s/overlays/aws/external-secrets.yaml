# ============================================================================
# How credentials reach the pods without ever existing in this repository.
#
# Terraform generated the Postgres password, the RabbitMQ password and the JWT
# signing key, and wrote them to AWS Secrets Manager. Nothing here contains a
# secret value -- only the ARNs to fetch them from and the shape to assemble
# them into.
#
# The External Secrets Operator authenticates with the IRSA role
# `<name>-external-secrets`, whose policy allows exactly three ARNs (see
# deploy/terraform/modules/platform/main.tf), reads those secrets, and
# materialises one Kubernetes Secret that the Deployments reference by name.
#
# Rotation comes free: change the value in Secrets Manager and ESO republishes
# it within refreshInterval. Add a `reloader` annotation and the pods restart
# themselves.
# ============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: REGION_PLACEHOLDER
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fieldnation-runtime
  namespace: fieldnation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore

  target:
    name: fieldnation-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Four logical databases in one RDS instance -- the same split as the
        # four db-* containers in docker-compose.yml. No service reads another
        # service's tables; the boundary is the code, not the instance count.
        WO_DSN:        "postgresql://{{ .dbuser }}:{{ .dbpass }}@{{ .dbhost }}:{{ .dbport }}/workorders?sslmode=require"
        TECH_DSN:      "postgresql://{{ .dbuser }}:{{ .dbpass }}@{{ .dbhost }}:{{ .dbport }}/technicians?sslmode=require"
        IDENTITY_DSN:  "postgresql://{{ .dbuser }}:{{ .dbpass }}@{{ .dbhost }}:{{ .dbport }}/identity?sslmode=require"
        PAYMENTS_DSN:  "postgresql://{{ .dbuser }}:{{ .dbpass }}@{{ .dbhost }}:{{ .dbport }}/payments?sslmode=require"

        # Note amqps and 5671, not amqp and 5672. Amazon MQ will not accept a
        # plaintext AMQP connection at all, so this is a genuine code
        # difference from local -- handled in libs/tsevents/src/bus.ts, which
        # switches to a TLS socket when the URL scheme is amqps.
        # The endpoint already carries the scheme and port from Terraform.
        RABBIT_URL:    "{{ .mqendpoint | replace \"amqps://\" (printf \"amqps://%s:%s@\" .mquser .mqpass) }}/%2F"

        JWT_SECRET:    "{{ .jwtsecret }}"

  data:
    - secretKey: dbuser
      remoteRef: { key: SECRET_PREFIX/postgres, property: username }
    - secretKey: dbpass
      remoteRef: { key: SECRET_PREFIX/postgres, property: password }
    - secretKey: dbhost
      remoteRef: { key: SECRET_PREFIX/postgres, property: host }
    - secretKey: dbport
      remoteRef: { key: SECRET_PREFIX/postgres, property: port }
    - secretKey: mquser
      remoteRef: { key: SECRET_PREFIX/rabbitmq, property: username }
    - secretKey: mqpass
      remoteRef: { key: SECRET_PREFIX/rabbitmq, property: password }
    - secretKey: mqendpoint
      remoteRef: { key: SECRET_PREFIX/rabbitmq, property: endpoint }
    - secretKey: jwtsecret
      remoteRef: { key: SECRET_PREFIX/app, property: jwt_secret }
