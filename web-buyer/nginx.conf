server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker embedded DNS. Without an explicit resolver, nginx resolves each
  # upstream ONCE at config load and caches it forever -- so after a container
  # is recreated the gateway silently routes to whichever service now holds that
  # IP. A variable in proxy_pass forces per-request resolution.
  #
  # The catch: once proxy_pass contains a variable, nginx no longer strips the
  # location prefix automatically, so each route rewrites the path explicitly.
  resolver 127.0.0.11 valid=10s ipv6=off;

  set $svc_api      api;
  set $svc_identity identity;
  set $svc_wo       work-orders;
  set $svc_pay      payments;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$svc_api:8000;
    proxy_set_header Host $host;
  }
  location /id/ {
    rewrite ^/id/(.*)$ /$1 break;
    proxy_pass http://$svc_identity:8000;
    proxy_set_header Host $host;
  }
  location /wo/ {
    rewrite ^/wo/(.*)$ /$1 break;
    proxy_pass http://$svc_wo:8000;
    proxy_set_header Host $host;
  }
  location /pay/ {
    rewrite ^/pay/(.*)$ /$1 break;
    proxy_pass http://$svc_pay:8000;
    proxy_set_header Host $host;
  }

  location / { try_files $uri $uri/ /index.html; }
}
