server {
  # 8080, not 80. Ports below 1024 need CAP_NET_BIND_SERVICE, so a container
  # serving on 80 must either run as root or carry that capability. The
  # Kubernetes namespace enforces the `restricted` Pod Security Standard, which
  # forbids both -- so the container listens high and runs as uid 101. The
  # published port on a laptop is unchanged (55173 / 55174); only the port
  # inside the container moved.
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Docker embedded DNS. Without an explicit resolver, nginx resolves each
  # upstream ONCE at config load and caches it forever -- so after a container
  # is recreated the gateway silently routes to whichever service now holds that
  # IP. A variable in proxy_pass forces per-request resolution.
  #
  # The catch: once proxy_pass contains a variable, nginx no longer strips the
  # location prefix automatically, so each route rewrites the path explicitly.
  # (Docker only. On Kubernetes the ALB path-routes /api, /id, /wo and /pay
  # directly to those Services, so nginx never proxies and never resolves.)
  resolver 127.0.0.11 valid=10s ipv6=off;

  set $svc_api      api;
  set $svc_identity identity;
  set $svc_wo       work-orders;
  set $svc_pay      payments;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$svc_api:8000;
    proxy_set_header Host $host;
  }
  location /id/ {
    rewrite ^/id/(.*)$ /$1 break;
    proxy_pass http://$svc_identity:8000;
    proxy_set_header Host $host;
  }
  location /wo/ {
    rewrite ^/wo/(.*)$ /$1 break;
    proxy_pass http://$svc_wo:8000;
    proxy_set_header Host $host;
  }
  location /pay/ {
    rewrite ^/pay/(.*)$ /$1 break;
    proxy_pass http://$svc_pay:8000;
    proxy_set_header Host $host;
  }

  location / { try_files $uri $uri/ /index.html; }
}
